name: Feature request
description: Suggest something the widget should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out?
      description: |
        The question you want the widget to answer, rather than the control you
        imagine. It usually leads somewhere better.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you had in mind
    validations:
      required: true

  - type: textarea
    id: data
    attributes:
      label: Where would the data come from?
      description: |
        This plugin only reports figures it can source exactly — llama.cpp's own
        counters, or OpenCode's recorded usage. If a feature needs a number
        nothing measures, say so; an honest gap beats an estimate.
